<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מערכת ניהול מוסך</title>
    <!-- For search engines and link previews only; nothing here changes the
         app. Google takes a site's icon from this page (the domain's home page),
         and the canonical points it at the landing page, so neither a search
         result nor a shared link for garagiox.com shows the login screen. The
         app's other routes are this same file and are closed by robots.txt. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://garagiox.com/marketing/" />
    <meta name="description" content="Garagiox – תוכנה לניהול מוסך: כרטיסי עבודה, סריקת חשבוניות ספקים, חשבוניות וסליקה." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="Garagiox" />
    <meta property="og:url" content="https://garagiox.com/marketing/" />
    <meta property="og:title" content="Garagiox – תוכנה לניהול מוסך" />
    <meta property="og:description" content="תוכנה לניהול מוסך בעברית ובערבית: כרטיסי עבודה, סריקת חשבוניות, חשבוניות וסליקה." />
    <meta property="og:image" content="https://garagiox.com/marketing/images/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Hebrew UI face. Windows has no Hebrew sans worth defaulting to, so
         Chrome there fell back to Arial and the app looked unfinished. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

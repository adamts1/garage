<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>מעבד תשלום…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #334; background: #fff; }
  p { font-size: 16px; }
</style>
</head>
<body>
<p>בודק את התשלום…</p>
<script>
  /* Where the payment provider's hosted page lands when it is done.

     It carries NO result we trust. The query string says good / error / cancel
     and whatever the provider appended, and all of it is ignored: anyone can
     type this URL. Its only job is to tell the screen that framed the payment
     page to go and ask the server, which asks the provider. */
  (function () {
    /* `result` only says which button the page sent us back by — cancel and
       error mean nobody is going to finish it. It never decides "paid". */
    var r = new URLSearchParams(window.location.search).get('r');
    var msg = { type: 'card-payment-return', result: r === 'cancel' || r === 'error' ? r : 'good' };
    try {
      if (window.parent && window.parent !== window) window.parent.postMessage(msg, window.location.origin);
      else if (window.opener) window.opener.postMessage(msg, window.location.origin);
    } catch (e) { /* the screen polls anyway */ }
  })();
</script>
</body>
</html>
